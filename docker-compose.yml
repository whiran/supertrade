services:
  # Fastify API Gateway & WebSocket Multiplexer
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: supertrade-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET:-}
      - ALPACA_FEED=${ALPACA_FEED:-iex}
      - OANDA_API_KEY=${OANDA_API_KEY:-}
      - OANDA_ACCOUNT_ID=${OANDA_ACCOUNT_ID:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Nginx Reverse Proxy & React Vite Frontend
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: supertrade-client
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  sqlite_data:
    name: supertrade_sqlite_data
